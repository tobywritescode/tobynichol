<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Notes // Toby Nichol</title>
    <meta name="description" content="Zero-backend encrypted notepad. AES-256-GCM via the Web Crypto API. IndexedDB persistence. No account, no server, no recovery — you own the key.">

    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">

    <style>
        /* ── Layout ──────────────────────────────────────────────────────────── */
        .sn-header { margin-bottom: 2.4rem; }

        /* ── Locked screen ───────────────────────────────────────────────────── */
        .vault-status {
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            margin-bottom: 2.2rem;
        }

        .vault-status-value { color: var(--accent-faint); }

        .vault-warning {
            font-size: 0.72rem;
            color: var(--text-dim);
            margin-bottom: 2rem;
            line-height: 1.7;
            max-width: 480px;
        }

        .vault-warning strong { color: var(--accent-faint); }

        .pass-form {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .pass-input {
            flex: 1 1 260px;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--accent-color);
            font-family: var(--font-mono);
            font-size: 0.82rem;
            padding: 0.55rem 0.9rem;
            outline: none;
            caret-color: var(--accent-color);
            letter-spacing: 0.12em;
            transition: border-color 0.15s;
        }

        .pass-input:focus { border-color: var(--accent-color); }

        .sn-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--accent-faint);
            font-family: var(--font-mono);
            font-size: 0.72rem;
            padding: 0.55rem 1.1rem;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }

        .sn-btn:hover:not(:disabled) { color: var(--accent-color); border-color: var(--accent-color); }
        .sn-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .sn-btn.danger:hover:not(:disabled) { color: #c0392b; border-color: #c0392b; }

        .auth-error {
            font-size: 0.72rem;
            color: #c0392b;
            min-height: 1.2em;
            letter-spacing: 0.04em;
        }

        /* ── Unlocked toolbar ────────────────────────────────────────────────── */
        .vault-toolbar {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding-bottom: 1.2rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .vault-toolbar .sn-btn { font-size: 0.68rem; padding: 0.4rem 0.85rem; }

        .note-count {
            margin-left: auto;
            font-size: 0.68rem;
            color: var(--text-dim);
            letter-spacing: 0.06em;
        }

        /* ── Note list ───────────────────────────────────────────────────────── */
        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0.65rem 0;
            border-bottom: 1px solid var(--glass-border);
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--accent-faint);
            transition: color 0.12s;
            gap: 1rem;
        }

        .note-item:hover { color: var(--accent-color); }

        .note-item.active {
            color: var(--accent-color);
        }

        .note-item.active .note-item-title::before {
            content: '> ';
        }

        .note-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .note-item-date  { color: var(--text-dim); font-size: 0.66rem; flex-shrink: 0; }

        .no-notes {
            font-size: 0.75rem;
            color: var(--text-dim);
            padding: 1.2rem 0;
            letter-spacing: 0.04em;
        }

        /* ── Editor ──────────────────────────────────────────────────────────── */
        #note-editor {
            margin-top: 2rem;
            padding-top: 1.6rem;
            border-top: 1px solid var(--glass-border);
        }

        .note-title-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--glass-border);
            color: var(--accent-color);
            font-family: var(--font-mono);
            font-size: 0.95rem;
            padding: 0.3rem 0 0.6rem;
            margin-bottom: 1.2rem;
            outline: none;
            box-sizing: border-box;
            letter-spacing: 0.04em;
        }

        .note-title-input::placeholder { color: var(--text-dim); }
        .note-title-input:focus { border-bottom-color: var(--accent-faint); }

        .note-body-textarea {
            width: 100%;
            min-height: 300px;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--accent-faint);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            padding: 0.9rem;
            outline: none;
            resize: vertical;
            line-height: 1.75;
            box-sizing: border-box;
            transition: border-color 0.15s;
        }

        .note-body-textarea::placeholder { color: var(--text-dim); opacity: 0.6; }
        .note-body-textarea:focus { border-color: var(--accent-faint); }

        .editor-footer {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .save-status {
            font-size: 0.66rem;
            color: var(--text-dim);
            letter-spacing: 0.08em;
            margin-left: auto;
        }

        .save-status.unsaved { color: #c0a03b; }
        .save-status.saving  { color: var(--text-dim); }
        .save-status.saved   { color: #5ba45b; }

        /* ── Import label acts as button ─────────────────────────────────────── */
        .import-label {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--accent-faint);
            font-family: var(--font-mono);
            font-size: 0.68rem;
            padding: 0.4rem 0.85rem;
            cursor: pointer;
            letter-spacing: 0.08em;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }

        .import-label:hover { color: var(--accent-color); border-color: var(--accent-color); }
        .import-label input { display: none; }

        /* ── Spinner animation ───────────────────────────────────────────────── */
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.2; } }
        .deriving { animation: blink 0.7s step-end infinite; }

        /* ── Mobile ──────────────────────────────────────────────────────────── */
        @media (max-width: 600px) {
            .pass-form { flex-direction: column; }
            .vault-toolbar { gap: 0.4rem; }
        }
    </style>
</head>
<body class="briefing-mode">
    <main class="hud-wrapper single-module-layout">
        <article class="hud-module briefing-container">
            <span class="module-meta">MODULE: SOVEREIGN_NOTES // AES-256-GCM</span>

            <header id="terminal-header" class="sn-header">
                <a href="../index.html" class="back-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
                    RETURN_TO_ROOT
                </a>
                <h1>Sovereign Notes</h1>
                <p class="subtitle">Local-First Encrypted Storage // No Server. No Account. No Recovery.</p>
            </header>

            <div class="briefing-content">

                <!-- ── Locked screen ──────────────────────────────────────── -->
                <div id="screen-locked">
                    <div class="vault-status">
                        VAULT STATUS: <span class="vault-status-value" id="vault-status-text">CHECKING…</span>
                    </div>

                    <p class="vault-warning" id="vault-warning"></p>

                    <form class="pass-form" id="pass-form" autocomplete="off">
                        <input
                            type="password"
                            id="pass-input"
                            class="pass-input"
                            placeholder="PASSPHRASE"
                            autocomplete="new-password"
                            spellcheck="false"
                            required
                        />
                        <button type="submit" id="unlock-btn" class="sn-btn">UNLOCK</button>
                    </form>

                    <div class="auth-error" id="auth-error"></div>
                </div>

                <!-- ── Unlocked screen ────────────────────────────────────── -->
                <div id="screen-unlocked" hidden>
                    <div class="vault-toolbar">
                        <button class="sn-btn" id="new-btn">+ NEW</button>
                        <button class="sn-btn" id="export-btn">EXPORT</button>
                        <label class="import-label">
                            IMPORT
                            <input type="file" id="import-input" accept=".vault,.json">
                        </label>
                        <button class="sn-btn danger" id="lock-btn">LOCK</button>
                        <span class="note-count" id="note-count"></span>
                    </div>

                    <div id="note-list"></div>

                    <div id="note-editor" hidden>
                        <input
                            type="text"
                            id="note-title"
                            class="note-title-input"
                            placeholder="TITLE"
                            spellcheck="false"
                            autocomplete="off"
                        />
                        <textarea
                            id="note-body"
                            class="note-body-textarea"
                            placeholder="Begin transmission…"
                            spellcheck="false"
                        ></textarea>
                        <div class="editor-footer">
                            <button class="sn-btn danger" id="delete-btn">DELETE</button>
                            <span class="save-status" id="save-status"></span>
                        </div>
                    </div>
                </div>

            </div>
        </article>
    </main>

    <div id="terminal-bg" aria-hidden="true"></div>

    <script type="module" src="../js/scripts.js"></script>

    <script>
    'use strict';

    // ── IndexedDB helpers ─────────────────────────────────────────────────────
    const DB_NAME    = 'sovereign-notes-v1';
    const DB_VERSION = 1;
    let _db = null;

    function openDB() {
        return new Promise(function(resolve, reject) {
            var req = indexedDB.open(DB_NAME, DB_VERSION);
            req.onupgradeneeded = function(e) {
                var d = e.target.result;
                if (!d.objectStoreNames.contains('notes'))  d.createObjectStore('notes',  { keyPath: 'id' });
                if (!d.objectStoreNames.contains('config')) d.createObjectStore('config');
            };
            req.onsuccess = function(e) { resolve(e.target.result); };
            req.onerror   = function(e) { reject(e.target.error); };
        });
    }

    function dbOp(storeName, mode, fn) {
        return new Promise(function(resolve, reject) {
            var t    = _db.transaction(storeName, mode);
            var req  = fn(t.objectStore(storeName));
            req.onsuccess = function() { resolve(req.result); };
            req.onerror   = function() { reject(req.error); };
        });
    }

    function dbGet(store, key)      { return dbOp(store, 'readonly',  function(s) { return s.get(key); }); }
    function dbGetAll(store)        { return dbOp(store, 'readonly',  function(s) { return s.getAll(); }); }
    function dbPut(store, val, key) { return dbOp(store, 'readwrite', function(s) { return key !== undefined ? s.put(val, key) : s.put(val); }); }
    function dbDel(store, key)      { return dbOp(store, 'readwrite', function(s) { return s.delete(key); }); }

    // ── Crypto ────────────────────────────────────────────────────────────────
    var ENC = new TextEncoder();
    var DEC = new TextDecoder();
    var VERIFY_PLAIN = 'SOVEREIGN_NOTES_V1';
    var PBKDF2_ITER  = 200000;

    function toB64(arr) {
        var s = '';
        var bytes = Array.isArray(arr) ? arr : Array.from(new Uint8Array(arr));
        for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return btoa(s);
    }

    function fromB64(s) {
        var raw = atob(s);
        var arr = new Array(raw.length);
        for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
        return arr;
    }

    async function deriveKey(passphrase, salt) {
        var raw = await crypto.subtle.importKey(
            'raw', ENC.encode(passphrase), 'PBKDF2', false, ['deriveKey']
        );
        return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: new Uint8Array(salt), iterations: PBKDF2_ITER, hash: 'SHA-256' },
            raw,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
        );
    }

    async function aesEncrypt(key, plaintext) {
        var iv = Array.from(crypto.getRandomValues(new Uint8Array(12)));
        var ct = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv: new Uint8Array(iv) },
            key,
            ENC.encode(plaintext)
        );
        return { iv: iv, data: Array.from(new Uint8Array(ct)) };
    }

    async function aesDecrypt(key, obj) {
        var pt = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: new Uint8Array(obj.iv) },
            key,
            new Uint8Array(obj.data)
        );
        return DEC.decode(pt);
    }

    // ── Vault init & auth ─────────────────────────────────────────────────────
    async function vaultExists() {
        var salt = await dbGet('config', 'salt');
        return !!salt;
    }

    async function createVault(passphrase) {
        var salt = Array.from(crypto.getRandomValues(new Uint8Array(16)));
        await dbPut('config', salt, 'salt');
        var key = await deriveKey(passphrase, salt);
        var verification = await aesEncrypt(key, VERIFY_PLAIN);
        await dbPut('config', verification, 'verify');
        return key;
    }

    async function openVault(passphrase) {
        var salt = await dbGet('config', 'salt');
        if (!salt) return null;
        var key  = await deriveKey(passphrase, salt);
        var verif = await dbGet('config', 'verify');
        if (!verif) return null;
        try {
            var plain = await aesDecrypt(key, verif);
            return plain === VERIFY_PLAIN ? key : null;
        } catch (e) {
            return null;
        }
    }

    // ── Note CRUD ─────────────────────────────────────────────────────────────
    function newId() {
        return typeof crypto.randomUUID === 'function'
            ? crypto.randomUUID()
            : Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    async function loadAllNotes(key) {
        var raw = await dbGetAll('notes');
        raw.sort(function(a, b) { return b.updated - a.updated; });
        var results = await Promise.all(raw.map(async function(n) {
            try {
                return {
                    id:      n.id,
                    title:   await aesDecrypt(key, n.encTitle),
                    body:    await aesDecrypt(key, n.encBody),
                    created: n.created,
                    updated: n.updated,
                };
            } catch (e) {
                return { id: n.id, title: '[CORRUPTED]', body: '', created: n.created, updated: n.updated };
            }
        }));
        return results;
    }

    async function persistNote(key, note) {
        var now = Date.now();
        await dbPut('notes', {
            id:       note.id,
            encTitle: await aesEncrypt(key, note.title || 'Untitled'),
            encBody:  await aesEncrypt(key, note.body  || ''),
            created:  note.created || now,
            updated:  now,
        });
    }

    // ── Export / Import ───────────────────────────────────────────────────────
    async function exportVault() {
        var salt   = await dbGet('config', 'salt');
        var verif  = await dbGet('config', 'verify');
        var raw    = await dbGetAll('notes');

        var payload = {
            version: 1,
            salt:    toB64(salt),
            verify:  { iv: toB64(verif.iv), data: toB64(verif.data) },
            notes:   raw.map(function(n) {
                return {
                    id:       n.id,
                    encTitle: { iv: toB64(n.encTitle.iv), data: toB64(n.encTitle.data) },
                    encBody:  { iv: toB64(n.encBody.iv),  data: toB64(n.encBody.data)  },
                    created:  n.created,
                    updated:  n.updated,
                };
            }),
        };

        var blob = new Blob([JSON.stringify(payload)], { type: 'application/octet-stream' });
        var url  = URL.createObjectURL(blob);
        var a    = document.createElement('a');
        a.href     = url;
        a.download = 'sovereign-' + new Date().toISOString().slice(0, 10) + '.vault';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    async function importVaultFile(file) {
        var text    = await file.text();
        var payload = JSON.parse(text);
        if (payload.version !== 1) throw new Error('Unsupported vault version');

        var existing = await dbGetAll('notes');
        for (var i = 0; i < existing.length; i++) await dbDel('notes', existing[i].id);

        await dbPut('config', fromB64(payload.salt), 'salt');
        await dbPut('config', {
            iv:   fromB64(payload.verify.iv),
            data: fromB64(payload.verify.data),
        }, 'verify');

        for (var j = 0; j < payload.notes.length; j++) {
            var n = payload.notes[j];
            await dbPut('notes', {
                id:       n.id,
                encTitle: { iv: fromB64(n.encTitle.iv), data: fromB64(n.encTitle.data) },
                encBody:  { iv: fromB64(n.encBody.iv),  data: fromB64(n.encBody.data)  },
                created:  n.created,
                updated:  n.updated,
            });
        }
    }

    // ── App state ─────────────────────────────────────────────────────────────
    var activeKey    = null;
    var activeNoteId = null;
    var notes        = [];
    var saveTimer    = null;
    var isNew        = false; // true when editing an unsaved note

    // ── Elements ──────────────────────────────────────────────────────────────
    var elLocked     = document.getElementById('screen-locked');
    var elUnlocked   = document.getElementById('screen-unlocked');
    var elStatusText = document.getElementById('vault-status-text');
    var elWarning    = document.getElementById('vault-warning');
    var elPassForm   = document.getElementById('pass-form');
    var elPassInput  = document.getElementById('pass-input');
    var elUnlockBtn  = document.getElementById('unlock-btn');
    var elAuthError  = document.getElementById('auth-error');
    var elNoteList   = document.getElementById('note-list');
    var elNoteEditor = document.getElementById('note-editor');
    var elNoteTitle  = document.getElementById('note-title');
    var elNoteBody   = document.getElementById('note-body');
    var elSaveStatus = document.getElementById('save-status');
    var elNoteCount  = document.getElementById('note-count');

    // ── Render ────────────────────────────────────────────────────────────────
    function esc(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function fmtDate(ts) {
        return new Date(ts).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function renderList() {
        elNoteCount.textContent = notes.length + ' note' + (notes.length === 1 ? '' : 's');
        if (notes.length === 0) {
            elNoteList.innerHTML = '<div class="no-notes">NO INTEL ON RECORD — click + NEW to begin</div>';
            return;
        }
        elNoteList.innerHTML = notes.map(function(n) {
            var active = n.id === activeNoteId ? ' active' : '';
            return '<div class="note-item' + active + '" data-id="' + esc(n.id) + '">'
                + '<span class="note-item-title">' + esc(n.title || 'Untitled') + '</span>'
                + '<span class="note-item-date">'  + fmtDate(n.updated) + '</span>'
                + '</div>';
        }).join('');
    }

    function openEditor(note) {
        activeNoteId      = note ? note.id : null;
        isNew             = !note;
        elNoteTitle.value = note ? note.title : '';
        elNoteBody.value  = note ? note.body  : '';
        elNoteEditor.hidden = false;
        setSaveStatus('');
        renderList();
        elNoteBody.focus();
    }

    function setSaveStatus(state, text) {
        elSaveStatus.className   = 'save-status' + (state ? ' ' + state : '');
        elSaveStatus.textContent = text || '';
    }

    // ── Autosave ──────────────────────────────────────────────────────────────
    function scheduleAutosave() {
        clearTimeout(saveTimer);
        setSaveStatus('unsaved', 'UNSAVED');
        saveTimer = setTimeout(doSave, 1400);
    }

    async function doSave() {
        if (!activeKey) return;
        var title = elNoteTitle.value.trim();
        var body  = elNoteBody.value;
        if (!title && !body) return;

        setSaveStatus('saving', 'SAVING…');
        try {
            var existing = notes.find(function(n) { return n.id === activeNoteId; });
            var note = existing
                ? { id: existing.id, title: title, body: body, created: existing.created }
                : { id: newId(),     title: title, body: body, created: Date.now() };

            if (!existing) activeNoteId = note.id;

            await persistNote(activeKey, note);
            notes = await loadAllNotes(activeKey);
            isNew = false;
            renderList();
            setSaveStatus('saved', 'SAVED');
        } catch (e) {
            setSaveStatus('unsaved', 'SAVE FAILED');
        }
    }

    // ── Lock / unlock ─────────────────────────────────────────────────────────
    async function showLocked() {
        clearTimeout(saveTimer);
        activeKey    = null;
        activeNoteId = null;
        notes        = [];
        elLocked.hidden   = false;
        elUnlocked.hidden = true;
        elPassInput.value = '';
        elAuthError.textContent = '';

        var exists = await vaultExists();
        if (exists) {
            elStatusText.textContent = 'LOCKED';
            elWarning.innerHTML = 'Enter your passphrase to decrypt local storage.';
            elUnlockBtn.textContent = 'UNLOCK VAULT';
        } else {
            elStatusText.textContent = 'NOT INITIALISED';
            elWarning.innerHTML = '<strong>First time?</strong> Choose a passphrase. '
                + 'Notes are encrypted with AES-256-GCM and stored locally in your browser. '
                + 'There is no server, no account, and <strong>no recovery</strong> — '
                + 'if you forget the passphrase, the data cannot be retrieved.';
            elUnlockBtn.textContent = 'INITIALISE VAULT';
        }
        elPassInput.focus();
    }

    function showUnlocked() {
        elLocked.hidden   = true;
        elUnlocked.hidden = false;
        elNoteEditor.hidden = true;
        activeNoteId = null;
        renderList();
    }

    // ── Event: unlock / create vault ──────────────────────────────────────────
    elPassForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        var pass = elPassInput.value;
        if (!pass) return;

        elUnlockBtn.disabled    = true;
        elUnlockBtn.textContent = 'DERIVING KEY…';
        elUnlockBtn.classList.add('deriving');
        elAuthError.textContent = '';

        try {
            var exists = await vaultExists();
            var key    = exists ? await openVault(pass) : await createVault(pass);

            if (!key) {
                elAuthError.textContent = 'PASSPHRASE REJECTED — DECRYPTION FAILED';
                elPassInput.value = '';
                elPassInput.focus();
                return;
            }

            activeKey = key;
            notes     = await loadAllNotes(key);
            showUnlocked();
        } catch (err) {
            elAuthError.textContent = 'ERROR: ' + err.message;
        } finally {
            elUnlockBtn.disabled = false;
            elUnlockBtn.classList.remove('deriving');
            elUnlockBtn.textContent = (await vaultExists()) ? 'UNLOCK VAULT' : 'INITIALISE VAULT';
        }
    });

    // ── Event: lock ───────────────────────────────────────────────────────────
    document.getElementById('lock-btn').addEventListener('click', function() {
        showLocked();
    });

    // ── Event: new note ───────────────────────────────────────────────────────
    document.getElementById('new-btn').addEventListener('click', function() {
        openEditor(null);
    });

    // ── Event: select note from list ──────────────────────────────────────────
    elNoteList.addEventListener('click', function(e) {
        var item = e.target.closest('.note-item');
        if (!item) return;
        var id   = item.dataset.id;
        var note = notes.find(function(n) { return n.id === id; });
        if (note) openEditor(note);
    });

    // ── Event: autosave on input ──────────────────────────────────────────────
    elNoteTitle.addEventListener('input', scheduleAutosave);
    elNoteBody.addEventListener('input',  scheduleAutosave);

    // ── Event: delete note ────────────────────────────────────────────────────
    document.getElementById('delete-btn').addEventListener('click', async function() {
        if (!activeNoteId && isNew) {
            elNoteEditor.hidden = true;
            return;
        }
        if (!activeNoteId) return;
        if (!confirm('DELETE THIS NOTE? This cannot be undone.')) return;
        clearTimeout(saveTimer);
        await dbDel('notes', activeNoteId);
        notes = await loadAllNotes(activeKey);
        activeNoteId = null;
        isNew = false;
        elNoteEditor.hidden = true;
        renderList();
    });

    // ── Event: export ─────────────────────────────────────────────────────────
    document.getElementById('export-btn').addEventListener('click', async function() {
        try { await exportVault(); }
        catch (e) { alert('Export failed: ' + e.message); }
    });

    // ── Event: import ─────────────────────────────────────────────────────────
    document.getElementById('import-input').addEventListener('change', async function(e) {
        var file = e.target.files[0];
        if (!file) return;
        if (!confirm('IMPORT VAULT?\n\nThis will replace all current notes and require you to re-enter the imported vault\'s passphrase. This cannot be undone.')) {
            e.target.value = '';
            return;
        }
        try {
            await importVaultFile(file);
            await showLocked();
            elAuthError.textContent = '';
            elStatusText.textContent = 'IMPORT COMPLETE — UNLOCK WITH VAULT PASSPHRASE';
        } catch (err) {
            alert('Import failed: ' + err.message);
        }
        e.target.value = '';
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    (async function() {
        _db = await openDB();
        await showLocked();
    })();
    </script>
</body>
</html>
